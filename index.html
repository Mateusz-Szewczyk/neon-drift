<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0118">
<title>NEON DRIFT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2300f0ff'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%23ff2d95'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <!-- Game canvas: renders parallax background, road, entities, particles -->
  <canvas id="game-canvas"></canvas>

  <!-- Chromatic vignette overlay (static, CSS, zero perf cost) -->
  <div id="vignette" aria-hidden="true"></div>

  <!-- Red flash overlay for collision feedback -->
  <div id="flash-overlay" aria-hidden="true"></div>

  <!-- Start screen -->
  <section id="start-screen" class="screen" aria-hidden="false">
    <div class="start-stack">
      <h1 class="title-logo">NEON<br>DRIFT</h1>
      <p class="tap-to-start">Tap to Start</p>
      <p class="best-score-label" id="start-best-label">BEST 0</p>
    </div>
  </section>

  <!-- In-game HUD overlay -->
  <div id="hud" class="hidden" aria-hidden="true">
    <div class="hud-block hud-score">
      <div class="hud-micro-label">Score</div>
      <div class="hud-score-value" id="hud-score">0</div>
      <div class="hud-best-line" id="hud-best">Best 0</div>
    </div>
    <div class="hud-block hud-combo hidden" id="hud-combo-block">
      <div class="hud-micro-label">Combo</div>
      <div class="hud-combo-value" id="hud-combo">x2</div>
    </div>
    <div class="powerup-badge hidden" id="powerup-badge">
      <svg class="powerup-ring" width="44" height="44" viewBox="0 0 44 44">
        <circle class="powerup-ring-track" cx="22" cy="22" r="19"></circle>
        <circle class="powerup-ring-progress" id="powerup-ring-progress" cx="22" cy="22" r="19"></circle>
      </svg>
      <span class="powerup-icon" id="powerup-icon"></span>
    </div>
  </div>

  <!-- Game over screen -->
  <section id="game-over-screen" class="screen hidden" aria-hidden="true">
    <div class="game-over-stack">
      <h2 class="game-over-headline">Game Over</h2>
      <div class="new-best-badge hidden" id="new-best-badge">New Best!</div>
      <div class="final-score-block">
        <div class="hud-micro-label">Score</div>
        <div class="final-score-value" id="final-score">0</div>
      </div>
      <div class="best-score-line" id="game-over-best">Best 0</div>
      <div class="button-row">
        <button type="button" class="btn-primary" id="restart-btn">Restart</button>
        <button type="button" class="btn-secondary" id="share-btn">Share</button>
      </div>
    </div>
  </section>
</div>

<script src="./game.js" defer></script>
</body>
</html>
